<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProCoaching — обучение PvP от топ-игроков СНГ</title>
<meta name="description" content="Профессиональное обучение PvP в Minecraft от лучших тренеров СНГ. Результат с первого занятия.">
<meta name="theme-color" content="#0d1711">
<style>
@font-face{font-family:Unb;font-weight:700;font-display:swap;src:url(fonts/unbounded-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Unb;font-weight:700;font-display:swap;src:url(fonts/unbounded-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Unb;font-weight:900;font-display:swap;src:url(fonts/unbounded-cyrillic-900-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Unb;font-weight:900;font-display:swap;src:url(fonts/unbounded-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:Gol;font-weight:400;font-display:swap;src:url(fonts/golos-text-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Gol;font-weight:400;font-display:swap;src:url(fonts/golos-text-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Gol;font-weight:500;font-display:swap;src:url(fonts/golos-text-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Gol;font-weight:500;font-display:swap;src:url(fonts/golos-text-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Gol;font-weight:600;font-display:swap;src:url(fonts/golos-text-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Gol;font-weight:600;font-display:swap;src:url(fonts/golos-text-latin-600-normal.woff2) format("woff2")}

:root{
  --ink:#0d1711; --ink-2:#132119; --ink-3:#1a2c22; --line:#26392e;
  --paper:#f3efe2; --mute:#8fa597; --dim:#5f7567;
  --gold:#ecc45c; --gold-ink:#6b5416;
  --ok:#7ed492; --busy:#e2735c;
  --pad:clamp(16px,4vw,56px);
  --u:Unb,system-ui,sans-serif; --g:Gol,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:var(--g);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.px{shape-rendering:crispEdges;display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}
.lbl{font-family:var(--u);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--u);font-weight:700;font-size:15px;letter-spacing:.02em;padding:16px 24px;border:2px solid var(--paper);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--paper)}
.btn:active{transform:none;box-shadow:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.gold:hover{box-shadow:4px 4px 0 var(--paper)}
.btn.sm{font-size:13px;padding:10px 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--u);font-weight:900;font-size:17px;letter-spacing:.06em}
.logo b{color:var(--gold);font-weight:900}
nav.top{display:flex;gap:4px;margin-left:auto}
nav.top a{font-family:var(--u);font-weight:700;font-size:13px;letter-spacing:.04em;padding:10px 14px;color:var(--mute)}
nav.top a:hover,nav.top a.on{color:var(--paper)}
nav.top a.on{box-shadow:inset 0 -3px 0 var(--gold)}
.burger{display:none;width:44px;height:44px;place-items:center;border:2px solid var(--line)}
@media (max-width:820px){nav.top{display:none}.burger{display:grid;margin-left:auto}.bar .btn{display:none}}

/* mobile menu */
.menu{position:fixed;inset:68px 0 0;z-index:19;background:var(--ink);padding:20px var(--pad) 40px;overflow:auto;display:none}
.menu.open{display:block}
.menu .lbl{margin:24px 0 10px}
.menu a.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-family:var(--u);font-weight:700;font-size:16px}
.menu a.row span{margin-left:auto;font-family:var(--g);font-weight:500;font-size:14px;color:var(--mute)}
.menu .btn{width:100%;justify-content:center;margin-top:28px}

/* hero */
.hero{padding:clamp(48px,9vw,120px) 0 0}
.hero .tag{display:inline-flex;align-items:center;gap:10px;font-family:var(--u);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--gold);margin-bottom:28px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:clamp(32px,5vw,72px);align-items:stretch}
.hero h1{font-family:var(--u);font-weight:900;font-size:clamp(40px,6.3vw,84px);line-height:1;letter-spacing:-.035em}
.ticket{position:relative;background:var(--gold);color:var(--ink);min-height:500px;display:block;transition:transform .15s}
.ticket:hover{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--line)}
.ticket::before{content:"";position:absolute;left:-12px;top:0;bottom:0;width:12px;background:repeating-linear-gradient(to bottom,var(--gold) 0 12px,transparent 12px 24px)}
.tk-clip{position:absolute;inset:0;overflow:hidden}
.tk-clip::before{content:"";position:absolute;right:0;top:0;width:144px;height:144px;background:conic-gradient(#d9ae45 25%,transparent 0 50%,#d9ae45 0 75%,transparent 0) 0 0/24px 24px;-webkit-mask:linear-gradient(225deg,#000 0 38%,transparent 38%);mask:linear-gradient(225deg,#000 0 38%,transparent 38%)}
.tk-lbl{position:absolute;left:24px;top:22px;font-family:var(--u);font-weight:900;font-size:11px;letter-spacing:.16em;background:var(--ink);color:var(--gold);padding:6px 9px}
.tk-tier{position:absolute;left:20px;top:58px;font-family:var(--u);font-weight:900;font-size:150px;line-height:1;letter-spacing:-.05em}
.tk-clip img{position:absolute;left:4%;bottom:56px;height:68%;filter:drop-shadow(10px 0 0 #d9ae45)}
.tk-bot{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border:2px solid var(--gold);border-top:0;color:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 20px;height:64px;font-family:var(--u);font-weight:900;font-size:20px}
.tk-bot span{font-weight:700;font-size:13px;color:var(--gold);display:flex;gap:8px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.ticket{min-height:380px;margin-left:12px}.tk-tier{font-size:112px;top:60px}.tk-clip img{left:auto;right:2%;height:74%}}
.hero h1 em{font-style:normal;color:var(--ink);background:var(--gold);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero-row{display:flex;flex-direction:column;gap:28px;margin-top:32px}
.hero p{font-size:clamp(17px,1.6vw,20px);color:var(--mute);max-width:46ch}
.hero p b{color:var(--paper);font-weight:500}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:520px){.hero .cta .btn{flex:1;justify-content:center}}

.motto{margin-top:clamp(48px,7vw,88px);border-top:2px solid var(--line);border-bottom:2px solid var(--line);overflow:hidden;white-space:nowrap}
.motto div{display:inline-block;font-family:var(--u);font-weight:900;font-size:clamp(18px,2.2vw,26px);letter-spacing:.02em;padding:14px 0;animation:run 26s linear infinite;color:var(--mute)}
.motto i{font-style:normal;color:var(--gold);margin:0 22px}
@keyframes run{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.motto div{animation:none}}

.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:28px 0 32px;border-right:2px solid var(--line);padding-left:clamp(0px,2vw,28px)}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--u);font-weight:900;font-size:clamp(30px,5vw,64px);letter-spacing:-.03em;line-height:1}
.stat span{display:block;margin-top:10px}
@media (max-width:520px){.stat{padding-left:12px}.stat .lbl{font-size:10px;letter-spacing:.12em}}

/* section head */
.sec{padding:clamp(64px,9vw,120px) 0 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.sec-head h2{font-family:var(--u);font-weight:900;font-size:clamp(32px,5vw,60px);letter-spacing:-.03em;line-height:1}
.sec-head p{color:var(--mute);max-width:36ch}

/* modes */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);border:2px solid var(--line)}
@media (max-width:1000px){.modes{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{position:relative;background:var(--ink);padding:22px 20px 20px;display:flex;flex-direction:column;min-height:228px;transition:background .15s}
.mode:hover{background:var(--gold);color:var(--ink)}
.mode:hover p,.mode:hover .n,.mode:hover .n small,.mode:hover .go{color:var(--ink)}
.mode:hover .new{background:var(--ink);color:var(--gold)}
.mode .ico{width:64px;height:64px;margin-bottom:auto}
.mode h3{font-family:var(--u);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-top:22px}
.mode p{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.35}
.mode .n{position:absolute;top:20px;right:18px;font-family:var(--u);font-weight:900;font-size:18px;color:var(--paper);text-align:right;line-height:1}
.mode .n small{display:block;font-family:var(--g);font-size:12px;font-weight:500;color:var(--mute);margin-top:4px}
.mode .new{position:absolute;top:18px;left:94px;font-family:var(--u);font-weight:900;font-size:10px;letter-spacing:.14em;background:var(--gold);color:var(--ink);padding:4px 7px}
.mode .go{margin-top:16px;font-family:var(--u);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--gold);display:flex;align-items:center;gap:8px}
.mode:hover .go{text-decoration:underline;text-underline-offset:4px}
@media (max-width:520px){.mode{min-height:200px;padding:16px 14px}.mode .ico{width:48px;height:48px}.mode h3{font-size:16px;margin-top:16px}.mode .n{top:14px;right:12px;font-size:16px}.mode .new{left:70px;top:16px}.coach{padding:20px 18px}.ava{width:48px;height:48px;font-size:19px}.c-rate b{font-size:20px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border:2px solid var(--line)}
.step{background:var(--ink);padding:28px 24px 30px}
.step i{display:block;font-style:normal;font-family:var(--u);font-weight:900;font-size:64px;line-height:1;color:var(--gold);letter-spacing:-.04em}
.step h3{font-family:var(--u);font-weight:700;font-size:20px;margin-top:18px;letter-spacing:-.01em}
.step p{color:var(--mute);margin-top:8px;font-size:15px}
@media (max-width:820px){.steps{grid-template-columns:1fr}.step{display:grid;grid-template-columns:72px 1fr;column-gap:8px;padding:22px 18px}.step i{grid-row:span 2;font-size:52px}.step h3{margin-top:2px}}
/* reviews */
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rv{border:2px solid var(--line);display:flex;flex-direction:column}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--gold);color:var(--ink);padding:14px 18px}
.rv-top b{font-family:var(--u);font-weight:900;font-size:17px;overflow-wrap:anywhere}
.rv-top small{display:block;font-family:var(--u);font-weight:700;font-size:10px;letter-spacing:.14em;opacity:.7}
.rv-stars{display:flex;gap:3px;flex:none}
.rv q{display:block;padding:20px 18px;font-size:17px;line-height:1.45;flex:1}
.rv q::before,.rv q::after{content:none}
.rv footer{margin:0;padding:14px 18px;border-top:2px solid var(--line);font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:10px}
.rv footer b{color:var(--paper);font-weight:600}
@media (max-width:900px){.revs{grid-template-columns:1fr}}
/* screenshare banner */
.ss{margin-top:clamp(64px,9vw,120px);background:var(--gold);color:var(--ink);position:relative}
.ss .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding-top:clamp(40px,6vw,72px);padding-bottom:clamp(40px,6vw,72px);align-items:center}
.ss .lbl{color:var(--gold-ink)}
.ss h2{font-family:var(--u);font-weight:900;font-size:clamp(34px,5.4vw,68px);line-height:1;letter-spacing:-.035em;margin-top:14px}
.ss p{font-size:18px;max-width:40ch;margin-top:18px}
.ss .btn{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.ss .btn:hover{box-shadow:4px 4px 0 var(--gold-ink)}
.ss ul{list-style:none;border-top:2px solid var(--ink)}
.ss li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid var(--ink);font-family:var(--u);font-weight:700;font-size:15px}
.ss li span{font-family:var(--u);font-weight:900;font-size:15px}
.teeth{position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,transparent 12px 24px)}
.teeth.t{top:-12px}.teeth.b{bottom:-12px}
@media (max-width:820px){.ss .wrap{grid-template-columns:1fr}}

/* footer */
footer{margin-top:clamp(64px,9vw,120px);border-top:2px solid var(--line);padding:36px 0 48px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* page head (inner pages) */
.phead{padding:clamp(36px,6vw,72px) 0 28px;border-bottom:2px solid var(--line)}
.back{display:inline-flex;gap:8px;align-items:center;font-family:var(--u);font-weight:700;font-size:13px;color:var(--mute);margin-bottom:28px}
.back:hover{color:var(--paper)}
.phead .row{display:flex;align-items:center;gap:22px}
.phead .ico{width:80px;height:80px;flex:none;background:var(--ink-2);border:2px solid var(--line);display:grid;place-items:center}
.phead .ico svg{width:56px;height:56px}
.phead h1{font-family:var(--u);font-weight:900;font-size:clamp(34px,6vw,76px);line-height:1;letter-spacing:-.035em}
.phead p{color:var(--mute);margin-top:8px}
@media (max-width:520px){.phead .ico{width:60px;height:60px}.phead .ico svg{width:40px;height:40px}}

/* tools */
.tools{display:grid;grid-template-columns:1fr auto;gap:12px;padding:22px 0}
.search{display:flex;align-items:center;gap:10px;border:2px solid var(--line);padding:0 14px;height:50px;background:var(--ink-2)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--dim)}
.select{height:50px;border:2px solid var(--line);background:var(--ink-2);padding:0 40px 0 14px;font-family:var(--u);font-weight:700;font-size:13px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:22px;border-bottom:2px solid var(--line)}
.chip{font-family:var(--u);font-weight:700;font-size:12px;letter-spacing:.02em;padding:9px 13px;border:2px solid var(--line);color:var(--mute)}
.chip:hover{color:var(--paper);border-color:var(--mute)}
.chip.on{background:var(--paper);border-color:var(--paper);color:var(--ink)}
@media (max-width:520px){.tools{grid-template-columns:1fr}.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none}}

/* coach list */
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--line);border:2px solid var(--line);margin-top:28px}
@media (max-width:820px){.list{grid-template-columns:1fr}}
.coach{background:var(--ink);padding:24px;display:flex;flex-direction:column;gap:16px}
.c-top{display:flex;gap:16px;align-items:center}
.ava{width:56px;height:56px;flex:none;display:grid;place-items:center;font-family:var(--u);font-weight:900;font-size:22px;color:var(--ink)}
.c-top>div:nth-child(2){min-width:0}
.c-top h3{font-family:var(--u);font-weight:700;font-size:clamp(16px,4.6vw,20px);letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.tier{font-family:var(--u);font-weight:900;font-size:11px;letter-spacing:.06em;color:var(--ink);background:var(--paper);padding:1px 7px}
.st{display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:8px;height:8px;background:var(--ok)}
.st.busy::before{background:var(--busy)}
.c-rate{margin-left:auto;text-align:right;flex:none}
.c-rate b{display:block;font-family:var(--u);font-weight:900;font-size:24px;line-height:1}
.c-rate span{font-size:12px;color:var(--mute)}
.bio{font-size:15px;color:#cfd6cc}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:500;padding:3px 8px;border:1px solid var(--line);color:var(--mute)}
.rev{border-left:4px solid var(--gold);padding:2px 0 2px 14px;font-size:14px}
.rev q{display:block;color:#cfd6cc}
.rev q::before,.rev q::after{content:none}
.rev small{display:block;margin-top:6px;color:var(--mute);font-size:12px}
.c-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.price b{font-family:var(--u);font-weight:900;font-size:24px}
.price span{font-size:13px;color:var(--mute);margin-left:4px}
.empty{padding:48px 0;color:var(--mute);text-align:center}
.empty .btn{margin-top:20px}

.note{margin-top:28px;font-size:14px;color:var(--mute);border:2px dashed var(--line);padding:14px 16px}

[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="#/" class="logo" aria-label="ProCoaching — на главную"><i data-px="star" data-s="3"></i><span><b>PRO</b>COACHING</span></a>
    <nav class="top">
      <a href="#/" data-nav="home">Режимы</a>
      <a href="#/screenshare" data-nav="ss">Screenshare</a>
    </nav>
    <a href="#/" class="btn gold sm" onclick="return false" title="Вход в концепте не работает">Войти</a>
    <button class="burger" aria-label="Меню" aria-expanded="false" id="burger"><i data-px="menu" data-s="3"></i></button>
  </div>
</header>

<div class="menu" id="menu">
  <a class="row" href="#/">Главная</a>
  <a class="row" href="#/screenshare">Screenshare</a>
  <div class="lbl">Тренировки</div>
  <div id="menu-modes"></div>
  <a href="#/" class="btn gold" onclick="return false">Войти</a>
</div>

<main id="app"></main>

<footer>
  <div class="wrap">
    <a href="#/" class="logo"><i data-px="star" data-s="3"></i><span><b>PRO</b>COACHING</span></a>
    <span>Концепт редизайна procoachingmc.ru · данные взяты с текущего сайта</span>
  </div>
</footer>

<script>
/* ---------- pixel icons (свои, 12×12) ---------- */
const P = {
  star:{c:{a:'#ecc45c'},r:[
    ".....a.....",".....a.....","....aaa....","aaaaaaaaaaa",".aaaaaaaaa.","..aaaaaaa..","..aaaaaaa..",".aaaa.aaaa.",".aa.....aa."]},
  starK:{c:{a:'#0d1711'},r:[
    "....a....","....a....","...aaa...","aaaaaaaaa",".aaaaaaa.","..aaaaa..","..aaaaa..",".aaa.aaa.",".a.....a."]},
  menu:{c:{a:'#f3efe2'},r:["aaaaaaa",".......","aaaaaaa",".......","aaaaaaa"]},

function px(name,s=4){
  const ic=P[name]; const w=Math.max(...ic.r.map(r=>r.length)), h=ic.r.length; let o='';
  ic.r.forEach((row,y)=>[...row].forEach((ch,x)=>{const f=ic.c[ch]; if(f) o+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${f}"/>`}));
  return `<svg class="px" width="${w*s}" height="${h*s}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${o}</svg>`;
}
function hydrate(root=document){root.querySelectorAll('[data-px]').forEach(el=>{el.innerHTML=px(el.dataset.px,+el.dataset.s||4);el.removeAttribute('data-px')})}

/* ---------- router ---------- */
const app=document.getElementById('app');
function route(){
  const h=location.hash;
  if(h==='#modes'){ if(!document.getElementById('modes')){app.innerHTML=home();hydrate(app)} document.getElementById('modes').scrollIntoView(); return }
  const m=h.match(/^#\/mode\/([\w-]+)/);
  let nav='home';
  if(m){ app.innerHTML=modeView(m[1]); hydrate(app);
    document.getElementById('sort').value=st.sort;
    app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.f=b.dataset.f;app.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));renderList(m[1])});
    document.getElementById('q').oninput=e=>{st.q=e.target.value;renderList(m[1])};
    document.getElementById('sort').onchange=e=>{st.sort=e.target.value;renderList(m[1])};
    renderList(m[1]);
  } else if(h==='#/screenshare'){ app.innerHTML=ssView(); hydrate(app); nav='ss' }
  else { app.innerHTML=home(); hydrate(app) }
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  closeMenu(); window.scrollTo(0,0);
}
const menu=document.getElementById('menu'), burger=document.getElementById('burger');
function closeMenu(){menu.classList.remove('open');burger.setAttribute('aria-expanded','false')}
burger.onclick=()=>{const o=menu.classList.toggle('open');burger.setAttribute('aria-expanded',o)};
document.getElementById('menu-modes').innerHTML=MODES.map(m=>`<a class="row" href="#/mode/${m.id}">${px(m.ico,2)}${m.name}<span>${m.n}</span></a>`).join('');
window.addEventListener('hashchange',route);
hydrate(); route();
